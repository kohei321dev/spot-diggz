<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>検索結果用施設カード案</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #666;
        --line: #d8d8d8;
        --surface: #fff;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background: #fff;
        font-family: Inter, "Noto Sans JP", "Yu Gothic", sans-serif;
      }

      a { color: inherit; }
      a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

      .site-header {
        padding: 18px max(20px, calc((100vw - 780px) / 2));
        border-bottom: 1px solid var(--line);
      }

      .brand { margin: 0; font-size: 1rem; font-weight: 800; }
      .section-name { margin: 4px 0 0; color: var(--muted); font-size: .78rem; }

      main { width: min(780px, calc(100% - 32px)); margin: 32px auto 56px; }
      h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); }
      .page-description { margin: 8px 0 20px; color: var(--muted); font-size: .85rem; line-height: 1.6; }

      .facility-card { border: 1px solid var(--line); background: var(--surface); }

      .card-header { padding: 20px; border-bottom: 1px solid var(--line); }
      .rank { margin: 0; color: var(--muted); font-size: .75rem; font-weight: 700; }
      .facility-name { margin: 8px 0 0; font-size: clamp(1.2rem, 3vw, 1.55rem); line-height: 1.35; }
      .facility-name a { text-decoration: none; }
      .facility-name a:hover { text-decoration: underline; }
      .address { margin: 6px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.55; }
      .recommendation { margin: 14px 0 0; font-size: .88rem; line-height: 1.65; }
      .recommendation strong { margin-right: 8px; }

      .card-body { padding: 20px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(240px, .8fr); gap: 20px; }
      figure { min-width: 0; margin: 0; }
      .video-frame { overflow: hidden; background: #000; }
      .video-frame iframe { width: 100%; aspect-ratio: 16 / 9; display: block; border: 0; }
      figcaption { margin-top: 8px; color: var(--muted); font-size: .72rem; line-height: 1.55; }

      .today { min-width: 0; }
      .today h2 { margin: 0; font-size: .95rem; }
      .availability { margin: 9px 0 0; font-size: .84rem; line-height: 1.6; }
      .today dl { margin: 18px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 12px; }
      .today dt { color: var(--muted); font-size: .7rem; font-weight: 700; }
      .today dd { margin: 4px 0 0; font-size: .81rem; font-weight: 700; line-height: 1.5; }

      .actions { margin-top: 20px; display: grid; gap: 8px; }
      .actions a { min-height: 42px; padding: 10px 14px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--ink); font-size: .8rem; font-weight: 800; text-decoration: none; }
      .actions .primary { color: #fff; background: var(--ink); }

      @media (max-width: 620px) {
        main { width: min(100% - 24px, 600px); margin-top: 24px; }
        .card-body { grid-template-columns: minmax(0, 1fr); }
      }

      @media (max-width: 390px) {
        .today dl { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <p class="brand">spot-diggz</p>
      <p class="section-name">検索結果</p>
    </header>

    <main>
      <h1>おすすめのスポット</h1>
      <p class="page-description">検索条件に合うスポットです。</p>

      <article class="facility-card" aria-labelledby="facility-name">
        <header class="card-header">
          <p class="rank">No.1</p>
          <h2 id="facility-name" class="facility-name">
            <a href="facility-detail-video-first-sample.html?facility=OSK-F001">SPOTAKA Skateboard Park（スポパー）</a>
          </h2>
          <p class="address">大阪府大阪市中央区西心斎橋1-6-14 BIGSTEP B2F</p>
          <p class="recommendation"><strong>おすすめ理由</strong>雨天でも予定を立てやすい屋内施設です。片道 約20分。</p>
        </header>

        <div class="card-body">
          <figure>
            <div class="video-frame">
              <iframe
                src="https://www.youtube-nocookie.com/embed/Map-nu_zJiM?autoplay=0"
                title="SPOPAR CUP VOL.5"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
            </div>
            <figcaption>参考動画：SPOPAR CUP VOL.5。撮影時点の様子であり、現在の利用可否を保証しません。</figcaption>
          </figure>

          <section class="today" aria-labelledby="today-title">
            <h2 id="today-title">今日行く前に確認</h2>
            <p class="availability">貸切・スクールにより一般利用時間が変わります。</p>
            <dl>
              <div><dt>平日</dt><dd>12:00–20:00</dd></div>
              <div><dt>土日祝</dt><dd>11:00–20:00</dd></div>
              <div><dt>料金</dt><dd>1時間 500円〜</dd></div>
              <div><dt>登録</dt><dd>無料会員登録が必要です。事前仮登録ができます。</dd></div>
            </dl>
            <nav class="actions" aria-label="施設への外部リンク">
              <a class="primary" href="https://www.google.com/maps/dir/?api=1&amp;destination=34.6724243%2C135.4966028" target="_blank" rel="noopener noreferrer">ここに行く</a>
              <a href="https://spotaka-skateboardpark.com/" target="_blank" rel="noopener noreferrer">公式情報を確認</a>
            </nav>
          </section>
        </div>
      </article>
    </main>
  </body>
</html>
