<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登録済みスポット一覧案</title>
    <style>
      :root {
        --ink: #17201c;
        --muted: #667169;
        --line: #d6ddd7;
        --surface: #ffffff;
        --accent: #147a50;
        --blue: #1765a6;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background: #e9ede9;
        font-family: Inter, "Noto Sans JP", "Yu Gothic", sans-serif;
      }

      a:focus-visible { outline: 3px solid #e6b63b; outline-offset: 3px; }

      header {
        padding: 24px max(20px, calc((100vw - 860px) / 2));
        color: #ffffff;
        background: #101914;
        border-bottom: 4px solid #44c58b;
      }

      .brand { margin: 0; font-size: 1.35rem; font-weight: 900; }
      .prototype { margin: 7px 0 0; color: #9de0bf; font: 700 .68rem/1.4 ui-monospace, monospace; letter-spacing: .08em; }

      main { width: min(860px, calc(100% - 32px)); margin: 34px auto 64px; }

      .intro { margin: 0 0 16px; }
      .intro h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); }
      .intro p { margin: 9px 0 0; color: var(--muted); font-size: .86rem; line-height: 1.65; }

      .spot-list { display: grid; gap: 13px; }

      .facility-row {
        padding: 20px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        border: 1px solid #c2ccc4;
        border-radius: 9px;
        background: var(--surface);
      }

      .facility-row h2 { margin: 0; font-size: 1.08rem; line-height: 1.4; }

      .detail-link {
        min-height: 44px;
        padding: 10px 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #aabac6;
        border-radius: 7px;
        color: var(--blue);
        font-size: .76rem;
        font-weight: 900;
        text-decoration: none;
        white-space: nowrap;
      }

      .detail-link:hover { background: #edf6fc; }

      .note {
        margin: 22px 0 0;
        padding: 14px 16px;
        border-left: 3px solid #e6b63b;
        color: #5d4a24;
        background: #fff8e7;
        font-size: .77rem;
        line-height: 1.6;
      }

      @media (max-width: 620px) {
        main { width: min(100% - 24px, 600px); margin-top: 24px; }
        .facility-row { grid-template-columns: minmax(0, 1fr); gap: 11px; }
        .detail-link { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="brand">spot-diggz</p>
      <p class="prototype">HTML PROTOTYPE / SAVED SPOTS</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="spot-list-title">
        <h1 id="spot-list-title">登録済みスポット</h1>
        <p>登録したスポットを一覧で確認できます。詳しい情報は各スポットの詳細ページで確認します。</p>
      </section>

      <div class="spot-list">
        <article class="facility-row">
          <h2>SPOTAKA Skateboard Park（スポパー）</h2>
          <a class="detail-link" href="facility-detail-video-first-sample.html?facility=OSK-F001">詳細を見る</a>
        </article>

        <article class="facility-row">
          <h2>スポーツパークまつばら</h2>
          <a class="detail-link" href="facility-detail-video-first-sample.html?facility=OSK-F002">詳細を見る</a>
        </article>

        <article class="facility-row">
          <h2>おくさま印スケボーパーク</h2>
          <a class="detail-link" href="facility-detail-video-first-sample.html?facility=OSK-F003">詳細を見る</a>
        </article>
      </div>

      <p class="note">動画、料金、営業時間、利用ルール、公式情報は「詳細を見る」から確認します。</p>
    </main>
  </body>
</html>
