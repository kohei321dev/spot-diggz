openapi: 3.1.0
info:
  title: spot-diggz MVP API
  version: 0.9.0
  description: |-
    Verified facility catalog, deterministic recommendation, correction, and
    observability API. Every application response includes `X-Request-ID` and
    `Cache-Control: no-store`.

    Origin coordinates and location-search queries are not persisted, written
    to access logs, or echoed by the application. When `GOOGLE_MAPS_API_KEY` is
    configured, origin coordinates are sent to Google Routes and location-search
    queries are sent to Google Geocoding.

    Facility responses can include curator-reviewed YouTube metadata and official
    social-profile links. They never contain arbitrary embed URLs or iframe HTML.

    APP_MODE=api exposes only healthz, readyz, POST /api/facilities/search, and
    GET /api/facilities/{facilityId}. Business endpoints require apiBearer;
    cookies do not authorize API mode. Other paths document retained legacy mode.
    API mode uses Geocoding only, never Routes, and returns no search-center
    coordinates or original query. Ambiguous place labels are returned only to
    the authenticated client for refinement. Public facility coordinates remain
    part of Facility. No new mode is deployed by this contract change.
security:
  - ownerSession: []
paths:
  /healthz:
    get:
      security: []
      operationId: getHealth
      summary: Check process liveness
      responses:
        '200':
          description: The process can serve HTTP requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      security: []
      operationId: getReadiness
      summary: Check application readiness
      description: |-
        Returns ready only when the loaded catalog contains at least one facility
        whose dynamic and stable verification timestamps are both within their
        freshness windows. This handler does not probe Google APIs or correction-
        store writability.
        In API mode, configured credentials, a location provider, and at least
        one fresh, classified spot with permission evidence are required.
        API modeではhoursStatus=unknown、日付別の利用確認が必要なrecordを除外する。
        根拠付きのstreetのhoursStatus=not_applicableは掲載可能だが、現在滑走可能な保証ではない。
      responses:
        '200':
          description: At least one loaded facility is fresh for both freshness windows.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: The catalog is empty or every facility is stale.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NotReadyStatus'
                  - $ref: '#/components/schemas/ErrorResponse'
  /api/facilities/search:
    post:
      operationId: searchNearbyFacilities
      security:
        - apiBearer: []
      summary: Search verified spots around a place (API mode only)
      description: |-
        JSON body only, at most 4096 bytes. Rejects unknown/duplicate keys, nulls,
        control characters, URL query parameters and out-of-range inputs.
        Uses straight-line kilometers before rounding; ties sort by facilityId.
        No automatic radius expansion or genre relaxation. Search is synchronous
        with a five-second location-provider timeout, no retries or persistence.
        Process-local authenticated search bucket: 30/minute, burst 5 (not a
        global/client/IP quota). Current opening/closure status is not filtered;
        consult returned rules and source information before visiting.
        hoursStatus=unknownは候補に含めない。not_applicableは営業時間制度がないことの
        確認済み状態であり、24時間利用可を表さない。availabilityNoteとルールを確認する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearbySearchInput'
      responses:
        '200':
          description: Structured result, including ambiguous location or insufficient catalog evidence.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbySearchResponse'
        '400':
          description: Invalid JSON/search input or unexpected URL query parameters.
          x-error-codes: [invalid_json, invalid_search_input, unexpected_query]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/InvalidAPIToken'
        '413':
          description: Request exceeds 4096 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Process-local rate limit exceeded; Retry-After is 60 seconds.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Missing authentication configuration or location provider failure/timeout.
          x-error-codes: [api_auth_unavailable, location_search_unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected search failure.
          x-error-codes: [search_failed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/facilities:
    get:
      operationId: listFacilities
      summary: List verified facilities
      parameters:
        - name: activity
          in: query
          required: false
          description: Case-insensitive activity filter.
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Verified facilities sorted by facility ID.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityList'
  /api/facilities/{facilityId}:
    get:
      operationId: getFacility
      security:
        - apiBearer: []
        - ownerSession: []
      summary: Get one verified facility
      description: |-
        API mode accepts apiBearer only; legacy mode accepts ownerSession only.
        These are deployment-mode alternatives, not interchangeable credentials.
        API mode rejects URL query parameters and limits authenticated reads to
        60/minute with a burst of 10 per process. Detail can include stale or
        unclassified records excluded from nearby search; check evidence dates.
        hoursStatus=unknownの参照情報も返り得る。hoursの省略を無制限利用と解釈しない。
      parameters:
        - name: facilityId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Verified facility detail.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          description: The facility does not exist in the loaded catalog.
          x-error-codes: [facility_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/InvalidAPIToken'
        '400':
          description: API mode does not accept URL query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: API-mode process-local read limit exceeded (Retry-After 60 seconds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: API-mode authentication configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The catalog lookup failed unexpectedly.
          x-error-codes: [facility_lookup_failed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/locations/search:
    post:
      operationId: searchLocations
      summary: Search a Japanese station or address
      description: |-
        Available only when `GOOGLE_MAPS_API_KEY` configures the Google
        Geocoding provider. The JSON-body query is sent to Google and is not
        persisted, written to the application access log, or exposed in the
        request URL. The process-local token bucket refills at 30 requests per
        minute with a burst of 5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSearchRequest'
      responses:
        '200':
          description: At most five Google Geocoding results.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSearchResponse'
        '400':
          description: JSON decoding failed, or the query is blank, too long, or contains a forbidden control character.
          x-error-codes: [invalid_json, invalid_location_query]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 1 KiB.
          x-error-codes: [request_too_large]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Google Geocoding is not configured or is temporarily unavailable.
          x-error-codes: [location_search_unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/recommendations:
    post:
      operationId: createRecommendations
      summary: Create deterministic facility recommendations
      description: |-
        Returns at most three recommendations. The process-local token bucket
        refills at 60 requests per minute with a burst of 10. Origin coordinates
        are not returned or persisted. With Google enabled they are sent to
        Compute Route Matrix; any Google Routes failure falls back to the
        straight-line provider. hoursStatusがknownまたは旧recordの省略状態の施設だけを
        時間計算に使い、not_applicable/unknownは外部provider呼出し前に除外する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionInput'
      responses:
        '200':
          description: Ranked recommendations, or an empty list when no facility meets every hard condition.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          description: JSON decoding or session-input validation failed.
          x-error-codes: [invalid_json, invalid_session_input]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB.
          x-error-codes: [request_too_large]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Both the selected travel provider and its fallback failed.
          x-error-codes: [recommendation_unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/corrections:
    post:
      operationId: submitCorrection
      summary: Submit a facility-data correction
      description: |-
        Stores a validated report in the configured JSON Lines file. The
        process-local token bucket refills at 30 requests per minute with a burst
        of 10. A contact email is optional and requires `contactConsent=true`.
        Stored reports receive a deletion deadline 90 days after receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionSubmission'
      responses:
        '202':
          description: The correction was accepted and stored.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionReceipt'
        '400':
          description: JSON decoding or correction-field validation failed.
          x-error-codes: [invalid_json, invalid_correction]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The submitted facility ID is not in the loaded catalog.
          x-error-codes: [facility_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 8 KiB.
          x-error-codes: [request_too_large]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The correction report could not be written.
          x-error-codes: [correction_store_unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/events:
    post:
      operationId: recordProductEvent
      summary: Record an allow-listed product journey event
      description: |-
        Accepts only a low-cardinality event name and no user, session, location,
        or free-text field. The process-local token bucket refills at 300 requests
        per minute with a burst of 60.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEventRequest'
      responses:
        '202':
          description: The product event was counted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
        '400':
          description: JSON decoding failed or the event is not allow-listed.
          x-error-codes: [invalid_json, invalid_product_event]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 1 KiB.
          x-error-codes: [request_too_large]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integrations/slack/commands:
    post:
      security: []
      operationId: receiveSlackCommand
      summary: Receive owner-only Slack commands and interactions
      description: |-
        Verifies Slack's HMAC-SHA256 request signature and five-minute replay
        window, then authorizes the configured team and user IDs. A slash command
        opens a search modal. A modal submission is acknowledged before geocoding
        and recommendation run in the background; candidates are returned as an
        ephemeral message with official-information and route links. Candidates,
        message history, and exact location input are never persisted.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              description: Slash command fields, or a signed `payload` field for modal and link-button interactions.
              properties:
                team_id:
                  type: string
                user_id:
                  type: string
                command:
                  type: string
                  const: /spotdiggz
                payload:
                  type: string
      responses:
        '200':
          description: Modal acknowledgement, interaction update, denial, or command error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: The signed command payload or response URL is invalid.
        '401':
          description: Slack request signature or timestamp verification failed.
        '413':
          description: The request body exceeds 64 KiB.
        '415':
          description: Content-Type is not application/x-www-form-urlencoded.
  /integrations/discord/interactions:
    post:
      security: []
      operationId: receiveDiscordInteraction
      summary: Receive the owner-only Discord interaction
      description: |-
        Verifies Discord's Ed25519 signature and five-minute replay window,
        handles PING, and authorizes the configured application, guild, and user
        IDs. An allowed /spotdiggz
        command receives an ephemeral deferred response that is updated with
        the recommendation. Message history is never queried or persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [type]
              properties:
                type:
                  type: integer
      responses:
        '200':
          description: PONG, ephemeral message, or deferred interaction response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: The signed interaction JSON or token is invalid.
        '401':
          description: Discord Ed25519 signature verification failed.
        '413':
          description: The request body exceeds 64 KiB.
        '415':
          description: Content-Type is not application/json.
  /metrics:
    get:
      security: []
      operationId: getPrometheusMetrics
      summary: Expose Prometheus metrics
      description: |-
        This endpoint has no application-level authentication. A production
        deployment must restrict it at the network or ingress boundary.
      responses:
        '200':
          description: Prometheus text exposition format version 0.0.4.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    apiBearer:
      type: http
      scheme: bearer
      description: Dedicated 32-byte random token encoded as 64 lowercase hex characters; scope facilities:read, configured owner mapping, expiry and revocation. HTTPS required outside loopback testing.
    ownerSession:
      type: apiKey
      in: cookie
      name: spotdiggz_session
      description: HMAC-signed HttpOnly session created after the allow-listed GitHub owner completes OAuth.
  headers:
    RequestID:
      description: Random request correlation ID generated by the application.
      schema:
        type: string
        minLength: 1
    RetryAfter:
      description: Seconds before retrying a process-local rate-limited request.
      schema:
        type: integer
        const: 60
  responses:
    InvalidAPIToken:
      description: Missing, malformed, unknown, expired or revoked API credential. WWW-Authenticate is Bearer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: "`Content-Type` is missing, invalid, or not `application/json`."
      x-error-codes: [unsupported_media_type]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The process-local token bucket rejected the request.
      x-error-codes: [rate_limited]
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    NearbySearchInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 120
          description: Place name; surrounding whitespace trimmed, control characters rejected. Never a required current location.
        genre:
          type: string
          enum: [skatepark, street]
          description: Omit for both. Street requires verified permission outside a skatepark.
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        radiusKm:
          type: number
          minimum: 0.1
          maximum: 50
          default: 10
        sort:
          type: string
          enum: [distance]
          default: distance
    NearbySearchResponse:
      type: object
      additionalProperties: false
      required: [status, matches, distanceKind, limit, radiusKm, sort, availabilityNote]
      properties:
        status:
          type: string
          enum: [ok, no_matches, data_unavailable, location_not_found, location_ambiguous]
          description: No matches means verified nearby data exists but genre does not match. Data unavailable means no nearby catalog coverage or insufficient evidence with zero matches; never asserts no real spots exist.
        matches:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [facility, distanceKm]
            properties:
              facility:
                $ref: '#/components/schemas/Facility'
              distanceKm:
                type: number
                minimum: 0
                maximum: 50
                description: Unrounded straight-line distance, not travel distance/time.
        locationCandidates:
          type: array
          minItems: 2
          maxItems: 5
          description: Only for location_ambiguous; refine the query using labels. No coordinates or persisted selection token.
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 300
        distanceKind:
          type: string
          const: straight_line
        limit:
          type: integer
          minimum: 1
          maximum: 10
        radiusKm:
          type: number
          minimum: 0.1
          maximum: 50
        sort:
          type: string
          const: distance
        availabilityNote:
          type: string
          minLength: 1
    ChatAcknowledgement:
      type: object
      additionalProperties: false
      required: [response_type, text]
      properties:
        response_type:
          type: string
          const: ephemeral
        text:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    NotReadyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: not_ready
    AcceptedStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    FacilityList:
      type: object
      additionalProperties: false
      required: [facilities]
      properties:
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
    LocationSearchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/LocationSearchResult'
    LocationSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 120
          description: A non-blank query without CR, LF, or NUL characters.
    LocationSearchResult:
      type: object
      additionalProperties: false
      required: [label, location]
      properties:
        label:
          type: string
          minLength: 1
        location:
          $ref: '#/components/schemas/Location'
    SessionInput:
      type: object
      additionalProperties: false
      required: [purpose, mood, level, availableMinutes, transport, origin]
      properties:
        purpose:
          type: string
          enum: [basics, street, transition]
        mood:
          type: string
          enum: [focused, easygoing, challenge]
        level:
          type: string
          enum: [beginner, returning, intermediate]
        availableMinutes:
          type: integer
          enum: [60, 120, 180, 240]
          description: Total time available for outbound travel, skating, and return travel.
        transport:
          type: string
          enum: [public_transit, car, bicycle, walk]
        origin:
          $ref: '#/components/schemas/SessionOrigin'
    SessionOrigin:
      type: object
      additionalProperties: false
      required: [mode, latitude, longitude]
      properties:
        mode:
          type: string
          enum: [current_location, specified_location]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    RecommendationResponse:
      type: object
      additionalProperties: false
      required: [recommendations, travelEstimateNote, availabilityNote]
      properties:
        recommendations:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Recommendation'
        travelEstimateNote:
          type: string
          minLength: 1
        availabilityNote:
          type: string
          minLength: 1
    Recommendation:
      type: object
      additionalProperties: false
      required:
        - facility
        - reasons
        - distanceKm
        - estimatedTravelMinutes
        - estimatedSkateMinutes
        - arrivalAt
        - facilityClosesAt
        - sessionEndsAt
        - travelEstimateKind
      properties:
        facility:
          $ref: '#/components/schemas/Facility'
        reasons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecommendationReason'
        distanceKm:
          type: number
          minimum: 0
        estimatedTravelMinutes:
          type: integer
          minimum: 0
        estimatedSkateMinutes:
          type: integer
          minimum: 1
        arrivalAt:
          type: string
          format: date-time
          description: Estimated arrival in Japan Standard Time.
        facilityClosesAt:
          type: string
          format: date-time
          description: End of the matching operating-hours window in Japan Standard Time.
        sessionEndsAt:
          type: string
          format: date-time
          description: Earlier of closing time and the latest return-departure time.
        travelEstimateKind:
          type: string
          enum: [straight_line, google_routes]
    RecommendationReason:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [purpose_match, beginner_friendly, mood_match, session_time_estimate, travel_estimate]
        message:
          type: string
          minLength: 1
    Facility:
      type: object
      additionalProperties: false
      description: |-
        公開catalogを読み取ったレスポンス。prefectureは国内47都道府県の正式名称であり、
        収録済み地域やプロダクト全体の対象地域を表さない。
        旧recordのhoursStatus省略はknown相当で、有効なhoursを必須とする。
        not_applicable/unknownではhoursとhoursBasisは返さない。catalog入力では空配列の
        hoursと空文字のhoursBasisも受理するが、レスポンスではomitemptyにより省略する。
        営業時間がないことと、営業時間を確認できていないことは別の状態として扱う。
      dependentRequired:
        genre: [skatingPermissionSourceUrl]
      allOf:
        - if:
            required: [generalUseStatus]
            properties:
              generalUseStatus:
                const: schedule_check_required
          then:
            required: [availabilityNote]
            properties:
              availabilityNote:
                pattern: '\S'
      oneOf:
        - title: 確認済み営業時間または旧record互換
          required: [hours]
          properties:
            hoursStatus:
              const: known
            hours:
              minItems: 1
        - title: 営業時間制度のない確認済みstreet
          required: [hoursStatus, genre, hoursSourceUrl, generalUseStatus, availabilityNote, englishTranslation]
          properties:
            hoursStatus:
              const: not_applicable
            genre:
              const: street
            generalUseStatus:
              enum: [regular, limited]
            availabilityNote:
              pattern: '\S'
            englishTranslation:
              required: [availabilityNote]
              properties:
                availabilityNote:
                  pattern: '\S'
          not:
            anyOf:
              - required: [hours]
              - required: [hoursBasis]
        - title: 営業時間を未確認の参照情報
          required: [hoursStatus, genre, generalUseStatus, availabilityNote, englishTranslation]
          properties:
            hoursStatus:
              const: unknown
            generalUseStatus:
              const: schedule_check_required
            availabilityNote:
              pattern: '\S'
            englishTranslation:
              required: [availabilityNote]
              properties:
                availabilityNote:
                  pattern: '\S'
          not:
            anyOf:
              - required: [hours]
              - required: [hoursBasis]
      required:
        - facilityId
        - name
        - address
        - prefecture
        - municipality
        - location
        - activities
        - scheduleNotes
        - price
        - reservation
        - beginnerFriendly
        - features
        - rules
        - access
        - englishTranslation
        - sourceUrl
        - sourceType
        - status
        - confidence
        - verifiedAt
        - dynamicVerifiedAt
        - stableVerifiedAt
      properties:
        facilityId:
          type: string
          minLength: 1
        genre:
          type: string
          enum: [skatepark, street]
          description: Optional for legacy records; unclassified records are excluded from nearby search.
        skatingPermissionSourceUrl:
          type: string
          format: uri
          pattern: '^https://'
          description: Curator-verified source of skating permission/rules; no embedded credentials or explicit port.
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        prefecture:
          type: string
          description: 国内の住所表現として受理する正式名称。実施設の収録・確認済み範囲とは別で、略称や前後の空白は受理しない。
          enum: [北海道, 青森県, 岩手県, 宮城県, 秋田県, 山形県, 福島県, 茨城県, 栃木県, 群馬県, 埼玉県, 千葉県, 東京都, 神奈川県, 新潟県, 富山県, 石川県, 福井県, 山梨県, 長野県, 岐阜県, 静岡県, 愛知県, 三重県, 滋賀県, 京都府, 大阪府, 兵庫県, 奈良県, 和歌山県, 鳥取県, 島根県, 岡山県, 広島県, 山口県, 徳島県, 香川県, 愛媛県, 高知県, 福岡県, 佐賀県, 長崎県, 熊本県, 大分県, 宮崎県, 鹿児島県, 沖縄県]
        municipality:
          type: string
          minLength: 1
        location:
          $ref: '#/components/schemas/Location'
        activities:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        hours:
          type: array
          description: known（hoursStatus省略を含む）でのみ返す。1件以上の有効な営業枠が必要。非knownではこのproperty自体を省略する。
          items:
            $ref: '#/components/schemas/OperatingHours'
        hoursStatus:
          type: string
          enum: [known, not_applicable, unknown]
          description: knownは確認済み時刻、not_applicableはstreetの営業時間制度なし、unknownは営業時間未確認。旧recordの省略はknown相当だが、明示的なknownへ書き換えて返さない。
        hoursSourceUrl:
          type: string
          format: uri
          pattern: '^https://(?:\[[^\]@\s]+\]|[^/?#:@\s\[\]]+)(?:[/?#]|$)'
          description: 営業時間または制度非該当を確認したHTTPS出典。認証情報・明示的portを含めない。not_applicableでは必須、それ以外では任意。
        generalUseStatus:
          type: string
          enum: [regular, limited, schedule_check_required]
          description: Whether ordinary general use is regular, limited, or requires a date-specific schedule check.
        hoursBasis:
          type: string
          enum: [official, conservative]
          description: knownでのみ返せる営業時間の根拠。公式公表値または公式情報の保守的解釈。not_applicable/unknownでは省略する。
        availabilityNote:
          type: string
          minLength: 1
          description: 一般利用や営業時間の制約・不足説明。not_applicable/unknownでは日英両方が必須。schedule_check_requiredでは日本語が必須。非該当を24時間利用可、未確認を無料や予約不要と解釈しない。
        scheduleNotes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        closurePeriods:
          type: array
          items:
            $ref: '#/components/schemas/ClosurePeriod'
        price:
          type: string
          minLength: 1
        reservation:
          type: string
          minLength: 1
        beginnerFriendly:
          type: boolean
        features:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        rules:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        access:
          $ref: '#/components/schemas/Access'
        englishTranslation:
          $ref: '#/components/schemas/FacilityEnglishTranslation'
        media:
          $ref: '#/components/schemas/FacilityMedia'
        socialLinks:
          type: array
          maxItems: 2
          description: At most one verified profile for each supported platform. Platform uniqueness is enforced by the catalog validator.
          items:
            $ref: '#/components/schemas/SocialLink'
        sourceUrl:
          type: string
          format: uri
          pattern: '^https?://'
        sourceType:
          type: string
          minLength: 1
        status:
          type: string
          const: verified
        confidence:
          type: string
          minLength: 1
        updatedAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
        dynamicVerifiedAt:
          type: string
          format: date-time
          description: Verification time for information with a 30-day freshness window.
        stableVerifiedAt:
          type: string
          format: date-time
          description: Verification time for information with a 180-day freshness window.
    FacilityMedia:
      type: object
      additionalProperties: false
      required: [youtube]
      properties:
        youtube:
          $ref: '#/components/schemas/YouTubeVideo'
    YouTubeVideo:
      type: object
      additionalProperties: false
      required: [provider, videoId, title, sourceUrl, selectedAt, verifiedAt, selectionReason]
      properties:
        provider:
          type: string
          const: youtube
        videoId:
          type: string
          pattern: '^[A-Za-z0-9_-]{11}$'
        title:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
          pattern: '^https://www\.youtube\.com/watch\?v=[A-Za-z0-9_-]{11}$'
          description: Canonical YouTube watch URL whose v parameter matches videoId.
        selectedAt:
          type: string
          format: date-time
          description: Curation selection time. Must not be later than verifiedAt.
        verifiedAt:
          type: string
          format: date-time
        selectionReason:
          type: string
          minLength: 1
    SocialLink:
      type: object
      additionalProperties: false
      required: [platform, url, verifiedAt]
      properties:
        platform:
          type: string
          enum: [instagram, x]
        url:
          type: string
          format: uri
          pattern: '^https://'
        verifiedAt:
          type: string
          format: date-time
      oneOf:
        - properties:
            platform:
              const: instagram
            url:
              pattern: '^https://(?:www\.)?instagram\.com/[A-Za-z0-9._]+/?$'
        - properties:
            platform:
              const: x
            url:
              pattern: '^https://(?:www\.)?x\.com/[A-Za-z0-9_]{1,15}/?$'
    Location:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    OperatingHours:
      type: object
      additionalProperties: false
      required: [day]
      properties:
        day:
          type: string
          description: "`daily`, `weekday`, `weekend`, or an English weekday; matching is case-insensitive."
        opens:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        closes:
          type: string
          pattern: '^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        closed:
          type: boolean
      oneOf:
        - required: [opens, closes]
          properties:
            closed:
              const: false
        - required: [closed]
          properties:
            closed:
              const: true
    ClosurePeriod:
      oneOf:
        - $ref: '#/components/schemas/OneTimeClosurePeriod'
        - $ref: '#/components/schemas/AnnualClosurePeriod'
    OneTimeClosurePeriod:
      type: object
      additionalProperties: false
      required: [type, start, end, reason]
      properties:
        type:
          type: string
          const: one_time
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
    AnnualClosurePeriod:
      type: object
      additionalProperties: false
      required: [type, start, end, reason]
      properties:
        type:
          type: string
          const: annual
        start:
          type: string
          pattern: '^(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$'
        end:
          type: string
          pattern: '^(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$'
        reason:
          type: string
          minLength: 1
    Access:
      type: object
      additionalProperties: false
      properties:
        stations:
          type: array
          items:
            type: string
        parking:
          type: string
        notes:
          type: string
    FacilityEnglishTranslation:
      type: object
      additionalProperties: false
      required: [name, address, scheduleNotes, price, reservation, rules, accessNotes]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        availabilityNote:
          type: string
          minLength: 1
          description: hoursStatus=not_applicable/unknownでは日本語availabilityNoteと対応する英語説明が必須。旧known recordでは省略可能。
        scheduleNotes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        price:
          type: string
          minLength: 1
        reservation:
          type: string
          minLength: 1
        rules:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        accessNotes:
          type: string
          minLength: 1
    CorrectionSubmission:
      type: object
      additionalProperties: false
      required: [facilityId, category, details]
      properties:
        facilityId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,63}$'
        category:
          type: string
          enum: [hours, price, rules, closure, access, other]
        details:
          type: string
          minLength: 10
          maxLength: 1000
        evidenceUrl:
          type: string
          format: uri
          maxLength: 500
          pattern: '^https://'
        contact:
          type: string
          format: email
          maxLength: 254
        contactConsent:
          type: boolean
      dependentSchemas:
        contact:
          required: [contactConsent]
          properties:
            contactConsent:
              const: true
    CorrectionReceipt:
      type: object
      additionalProperties: false
      required: [reportId, receivedAt, nextAction]
      properties:
        reportId:
          type: string
          pattern: '^COR-[0-9a-f]{32}$'
        receivedAt:
          type: string
          format: date-time
        nextAction:
          type: string
          minLength: 1
    ProductEventRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          type: string
          enum:
            - input_started
            - input_completed
            - recommendation_completed
            - result_displayed
            - source_opened
            - navigation_opened
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_query
                - facility_not_found
                - facility_lookup_failed
                - invalid_location_query
                - location_search_unavailable
                - invalid_json
                - invalid_session_input
                - recommendation_unavailable
                - invalid_correction
                - correction_store_unavailable
                - invalid_product_event
                - unsupported_media_type
                - request_too_large
                - rate_limited
            message:
              type: string
              minLength: 1
